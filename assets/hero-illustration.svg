    <text x="110" y="288" font-size="30" fill="#8b949e">Full Stack (MERN)  •  Backend  •  Open Source</text>
  </g>
  <rect x="110" y="314" width="180" height="5" rx="2.5" fill="url(#accentBar)"/>
  <text x="110" y="358" font-family="'JetBrains Mono','Fira Code',SFMono-Regular,Consolas,monospace" font-size="22" fill="#6e7681">119+ public repos  •  always shipping</text>
  <g font-family="-apple-system,'Segoe UI',Inter,Roboto,sans-serif" font-size="22">
