<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="500" viewBox="0 0 1600 500" role="img" aria-label="Ashutosh Sajan — Full Stack Developer">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0d1117"/>
      <stop offset="0.55" stop-color="#0a0f1e"/>
      <stop offset="1" stop-color="#010409"/>
    </linearGradient>
    <radialGradient id="auroraB" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#1f6feb" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#1f6feb" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="auroraP" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#a371f7" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#a371f7" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="nameGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#a5d6ff"/>
    </linearGradient>
    <linearGradient id="accentBar" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#58a6ff"/>
      <stop offset="0.5" stop-color="#a371f7"/>
      <stop offset="1" stop-color="#f778ba"/>
    </linearGradient>
    <filter id="soft" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="26"/>
    </filter>
    <pattern id="dots" width="34" height="34" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.6" fill="#58a6ff" opacity="0.10"/>
    </pattern>
  </defs>

  <!-- backdrop -->
  <rect width="1600" height="500" fill="url(#bg)"/>
  <g opacity="0.8">
    <ellipse cx="1230" cy="90" rx="520" ry="230" fill="url(#auroraB)">
      <animateTransform attributeName="transform" type="translate" values="0 0; 40 14; 0 0" dur="14s" repeatCount="indefinite"/>
    </ellipse>
    <ellipse cx="280" cy="430" rx="460" ry="210" fill="url(#auroraP)">
      <animateTransform attributeName="transform" type="translate" values="0 0; -34 -12; 0 0" dur="17s" repeatCount="indefinite"/>
    </ellipse>
  </g>
  <rect width="1600" height="500" fill="url(#dots)"/>
  <ellipse cx="800" cy="512" rx="720" ry="70" fill="#1f6feb" opacity="0.16"/>

  <!-- stars -->
  <g fill="#ffffff">
    <circle cx="80" cy="60" r="1.8" opacity="0.7"/><circle cx="200" cy="180" r="1.3" opacity="0.4"/>
    <circle cx="330" cy="70" r="2" opacity="0.6"/><circle cx="470" cy="150" r="1.2" opacity="0.35"/>
    <circle cx="580" cy="60" r="1.7" opacity="0.55"/><circle cx="700" cy="200" r="1.2" opacity="0.3"/>
    <circle cx="830" cy="70" r="2.1" opacity="0.65"/><circle cx="950" cy="40" r="1.4" opacity="0.45"/>
    <circle cx="1080" cy="60" r="1.6" opacity="0.5"/><circle cx="1420" cy="60" r="1.9" opacity="0.6"/>
    <circle cx="1530" cy="150" r="1.4" opacity="0.4"/><circle cx="1500" cy="330" r="1.7" opacity="0.5"/>
    <circle cx="60" cy="330" r="1.5" opacity="0.4"/><circle cx="180" cy="440" r="1.8" opacity="0.5"/>
    <circle cx="420" cy="400" r="1.3" opacity="0.35"/><circle cx="640" cy="450" r="1.6" opacity="0.45"/>
    <circle cx="880" cy="440" r="1.3" opacity="0.3"/><circle cx="120" cy="240" r="1.2" opacity="0.3"/>
    <circle cx="760" cy="320" r="1.4" opacity="0.3"/><circle cx="1560" cy="240" r="1.5" opacity="0.4"/>
