      <rect x="1405" y="356" width="42" height="10" rx="4" fill="#bb8009"/>
      <line x1="1426" y1="358" x2="1426" y2="318" stroke="#3fb950" stroke-width="4" stroke-linecap="round"/>
      <ellipse cx="1406" cy="322" rx="10" ry="24" fill="#3fb950" opacity="0.9" transform="rotate(-28 1406 322)"/>
      <ellipse cx="1446" cy="322" rx="10" ry="24" fill="#3fb950" opacity="0.9" transform="rotate(28 1446 322)"/>
      <ellipse cx="1426" cy="306" rx="10" ry="26" fill="#56d364" opacity="0.95"/>
