    </g>
    <text x="1072" y="210" font-family="'JetBrains Mono','Fira Code',Consolas,monospace" font-size="14" font-style="italic" fill="#6e7681">// i turn coffee into APIs</text>
    <g>
      <rect x="1072" y="221" width="46" height="11" rx="5.5" fill="#ff7b72"/>
      <rect x="1126" y="221" width="70" height="11" rx="5.5" fill="#79c0ff"/>
      <rect x="1204" y="221" width="12" height="11" rx="5.5" fill="#8b949e"/>
      <rect x="1224" y="221" width="110" height="11" rx="5.5" fill="#a5d6ff"/>
      <rect x="1100" y="242" width="80" height="11" rx="5.5" fill="#d2a8ff"/>
      <rect x="1188" y="242" width="56" height="11" rx="5.5" fill="#79c0ff"/>
      <rect x="1128" y="263" width="150" height="11" rx="5.5" fill="#a5d6ff"/>
      <rect x="1286" y="261" width="9" height="16" fill="#58a6ff">
