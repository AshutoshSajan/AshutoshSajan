      <rect x="1204" y="305" width="90" height="11" rx="5.5" fill="#a5d6ff"/>
    </g>
    <text x="1072" y="338" font-family="'JetBrains Mono','Fira Code',Consolas,monospace" font-size="14" font-style="italic" fill="#6e7681">// 119+ repos &amp; counting</text>
    <g>
      <rect x="1072" y="347" width="80" height="11" rx="5.5" fill="#d2a8ff"/>
      <rect x="1160" y="347" width="96" height="11" rx="5.5" fill="#a5d6ff"/>
    </g>

    <!-- coffee -->
    <g>
      <ellipse cx="962" cy="404" rx="44" ry="9" fill="#161b22" stroke="#30363d" stroke-width="1.5"/>
      <rect x="932" y="350" width="60" height="52" rx="9" fill="#a371f7"/>
      <rect x="932" y="350" width="60" height="14" rx="7" fill="#8957e5"/>
      <ellipse cx="962" cy="352" rx="24" ry="6" fill="#3b2305"/>
