    <circle cx="140" cy="405" r="7" fill="#3fb950"/>
    <text x="156" y="413" fill="#3fb950">Open to Work</text>
    <rect x="338" y="384" width="216" height="42" rx="21" fill="none" stroke="#58a6ff" stroke-width="1.6" opacity="0.9"/>
    <circle cx="368" cy="405" r="7" fill="none" stroke="#58a6ff" stroke-width="2.4"/>
    <text x="384" y="413" fill="#7aa2f7">Based in India</text>
  </g>

